name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install
      - run: npm test
      # the whole build, not just the web workspace: CI only ever ran `-w web`, so `npm run
      # build` was free to call a script the server workspace does not have and nothing noticed
      - run: npm run build
